<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plantillas de Domi</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3E9A86">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root { --bg:#f6f5f2; --card:#fff; --ink:#24292f; --soft:#6b7480; --line:#e3e1dc; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:18px 20px 6px; display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; }
  h1 { font-size:22px; margin:0; }
  header p { margin:4px 0 0; color:var(--soft); font-size:14px; }
  main { display:grid; grid-template-columns: minmax(280px, 380px) 1fr; gap:18px; padding:14px 20px 30px; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; }
  .step { margin-bottom:16px; }
  .step > label, .step > .t { display:block; font-weight:600; font-size:14px; margin-bottom:6px; }
  .step .n { display:inline-block; width:20px; height:20px; border-radius:50%; background:var(--ink); color:#fff; font-size:12px; text-align:center; line-height:20px; margin-right:6px; }
  select, input[type=text], input[type=number] { width:100%; padding:10px; font-size:15px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { border:1px solid var(--line); background:#fff; border-radius:999px; padding:8px 12px; font-size:14px; cursor:pointer; color:var(--ink); }
  .chip.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .chip.small { padding:6px 10px; font-size:13px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  input[type=range] { width:100%; }
  .sw { width:30px; height:30px; border-radius:50%; border:3px solid #fff; box-shadow:0 0 0 1px var(--line); cursor:pointer; padding:0; }
  .sw.on { box-shadow:0 0 0 2px var(--ink); }
  .picker { position:relative; width:30px; height:30px; border-radius:50%; overflow:hidden; cursor:pointer;
            background:conic-gradient(#e74c3c,#f1c40f,#2ecc71,#3498db,#9b59b6,#e74c3c); box-shadow:0 0 0 1px var(--line); border:3px solid #fff; }
  .picker.on { box-shadow:0 0 0 2px var(--ink); }
  .picker input { position:absolute; inset:-8px; width:46px; height:46px; opacity:0; cursor:pointer; }
  .themeSw { display:inline-block; width:12px; height:12px; border-radius:50%; margin-right:6px; vertical-align:-1px; box-shadow:0 0 0 1px rgba(0,0,0,.25); }
  .check { display:flex; align-items:center; gap:8px; font-size:14px; margin:6px 0; }
  .check input { width:18px; height:18px; }
  .hint { color:var(--soft); font-size:12px; margin-top:4px; }
  .fname { display:flex; align-items:center; border:1px solid var(--line); border-radius:10px; background:#fff; overflow:hidden; }
  .fname input { border:none; border-radius:0; }
  .fname span { padding:0 10px; color:var(--soft); font-size:14px; }
  .btns { display:flex; flex-direction:column; gap:8px; margin-top:6px; }
  button.big { padding:13px; font-size:16px; font-weight:600; border-radius:12px; border:none; cursor:pointer; }
  .primary { background:var(--ink); color:#fff; }
  .secondary { background:#ece9e2; color:var(--ink); }
  .coverBar { display:flex; justify-content:space-between; align-items:center; gap:8px; background:#f3efe4; border-radius:10px; padding:10px 12px; margin-bottom:14px; font-size:14px; font-weight:600; }
  .coverBar[hidden] { display:none; }
  #msg { font-size:13px; margin-top:8px; min-height:18px; }
  .preview { display:flex; flex-direction:column; align-items:center; gap:10px; }
  .preview canvas { max-width:100%; border-radius:8px; box-shadow:0 6px 24px rgba(0,0,0,.12); background:#fff; }
  .preview .cap { color:var(--soft); font-size:13px; }
</style>
</head>
<body>
<header>
  <div>
    <h1 data-t="title"></h1>
    <p data-t="subtitle"></p>
  </div>
  <div class="chips" id="appLang" aria-label="Language"></div>
</header>

<main>
  <section class="panel" id="controls">
    <div class="step pg">
      <label for="device"><span class="n">1</span><span data-t="s_tablet"></span></label>
      <select id="device"></select>
      <div class="hint" id="deviceInfo"></div>
    </div>

    <div class="step pg">
      <span class="t"><span class="n">2</span><span data-t="s_orient"></span></span>
      <div class="chips" id="orient"></div>
      <div class="hint" data-t="h_orient"></div>
    </div>

    <div class="step pg">
      <span class="t"><span class="n">3</span><span data-t="s_style"></span></span>
      <div class="chips" id="styles"></div>
      <div class="hint" id="styleInfo"></div>
    </div>

    <div class="step pg">
      <span class="t"><span class="n">4</span><span data-t="s_tlang"></span></span>
      <div class="chips" id="langs"></div>
      <div class="hint" data-t="h_tlang"></div>
    </div>

    <div class="step pg" id="spacingStep">
      <label for="spacing"><span class="n">5</span><span data-t="s_spacing"></span>: <span id="spacingVal"></span> mm</label>
      <input type="range" id="spacing" min="5" max="12" step="0.5" value="8">
      <div class="hint" id="spacingHint"></div>
    </div>

    <div class="step pg">
      <span class="t"><span class="n">6</span><span data-t="s_paper"></span></span>
      <div class="chips" id="themes"></div>
      <div class="hint" data-t="h_paper"></div>
    </div>

    <div class="step pg">
      <span class="t"><span class="n">7</span><span data-t="s_accent"></span></span>
      <div class="row" id="accents"></div>
      <div class="hint" data-t="h_accent"></div>
    </div>

    <div class="step pg">
      <span class="t"><span class="n">8</span><span data-t="s_extras"></span></span>
      <label class="check"><input type="checkbox" id="header" checked> <span data-t="o_header"></span></label>
      <input type="text" id="subject" maxlength="40">
      <label class="check" id="marginRow"><input type="checkbox" id="margin" checked> <span data-t="o_margin"></span></label>
      <label class="check"><input type="checkbox" id="cover"> <span data-t="o_cover"></span></label>
      <label class="check"><input type="checkbox" id="index"> <span data-t="o_index"></span></label>
    </div>

    <div class="step pg">
      <label for="pages"><span class="n">9</span><span data-t="s_pages"></span></label>
      <input type="number" id="pages" min="1" max="100" value="60">
      <label for="startNum" class="t" style="margin-top:12px;display:block;font-weight:600;font-size:14px" data-t="s_start"></label>
      <input type="number" id="startNum" min="1" max="9999">
      <div class="hint" data-t="h_start"></div>
    </div>

    <div id="coverBar" class="coverBar" hidden>
      <span data-t="c_editing"></span>
      <button class="chip small" id="backToPage" data-t="c_back"></button>
    </div>
    <div id="coverControls" hidden>
      <div class="step">
        <span class="t"><span class="n">1</span><span data-t="c_design"></span></span>
        <div class="chips" id="coverDesigns"></div>
        <div class="hint" id="coverInfo"></div>
      </div>
      <div class="step">
        <label for="coverTitle"><span class="n">2</span><span data-t="c_title"></span></label>
        <input type="text" id="coverTitle" maxlength="40">
      </div>
      <div class="step">
        <label for="coverSub"><span class="n">3</span><span data-t="c_sub"></span></label>
        <input type="text" id="coverSub" maxlength="60">
      </div>
      <div class="step">
        <span class="t"><span class="n">4</span><span data-t="s_extras"></span></span>
        <label class="check"><input type="checkbox" id="coverName" checked> <span data-t="c_name"></span></label>
        <input type="text" id="coverNameText" maxlength="40">
        <div class="hint" data-t="h_cname"></div>
        <label class="check" style="margin-top:10px"><input type="checkbox" id="coverYear"> <span data-t="c_year"></span></label>
        <input type="text" id="coverYearText" maxlength="12">
        <div class="hint" data-t="h_cyear"></div>
      </div>
      <div class="step">
        <span class="t"><span class="n">5</span><span data-t="c_where"></span></span>
        <div class="chips" id="coverWhere"></div>
        <div class="hint" id="coverWhereInfo"></div>
        <button class="big secondary" id="dlCover" style="width:100%;margin-top:10px" data-t="b_cover"></button>
      </div>
      <div class="hint" style="margin:-6px 0 16px" data-t="c_shared"></div>
    </div>

    <div class="step">
      <label for="fname"><span class="n" id="fnameNum">10</span><span data-t="s_fname"></span></label>
      <div class="fname"><input type="text" id="fname" maxlength="60" spellcheck="false"><span>.pdf</span></div>
      <div class="hint" data-t="h_fname"></div>
    </div>

    <div class="btns">
      <button class="big primary" id="dlPdf" data-t="b_pdf"></button>
      <div class="hint" data-t="h_pdf"></div>
      <button class="big secondary" id="dlPng" data-t="b_png"></button>
      <div class="hint" data-t="h_png"></div>
    </div>
    <div id="msg"></div>
  </section>

  <section class="preview">
    <div class="chips" id="pvTabs"></div>
    <canvas id="preview"></canvas>
    <div class="cap" id="cap"></div>
  </section>
</main>

const nav = (navigator.language || "en").slice(0, 2);
const startLang = UI[nav] ? nav : "en";

// Lo que la persona ha elegido
const state = { device: "s10plus", style: "lined", theme: "light", accent: ACCENTS[1],
                lang: startLang, ui: startLang, orient: "portrait", previewPage: "page", fileEdited: false, coverDesign: "band", coverMode: "separate" };
const L = () => LANGS[state.lang];
const T = () => UI[state.ui];

// ---------------------------------------------------------------
// 2. MEDIDAS: tamaño de la hoja en mm y en píxeles
// ---------------------------------------------------------------
function pageSize() {
  const d = DEVICES.find(x => x.id === state.device);
  let wMm, hMm, wPx, hPx;
  if (d.mm) {                       // papel: lo dibujamos a 200 píxeles por pulgada
    [wMm, hMm] = d.mm;
    wPx = Math.round(wMm / 25.4 * 200); hPx = Math.round(hMm / 25.4 * 200);
  } else {                          // tablet: píxeles reales de la pantalla
    [wPx, hPx] = d.px;
    const ppi = Math.hypot(wPx, hPx) / d.inch;   // píxeles por pulgada
    wMm = wPx / ppi * 25.4; hMm = hPx / ppi * 25.4;
  }
  if (state.orient === "landscape") { [wMm, hMm] = [hMm, wMm]; [wPx, hPx] = [hPx, wPx]; }
  return { wMm, hMm, wPx, hPx };
}

function options() {
  const v = id => document.getElementById(id);
  return {
    spacing: parseFloat(v("spacing").value),
    header: v("header").checked,
    subject: v("subject").value.trim(),
    margin: v("margin").checked,
    cover: v("cover").checked,
    index: v("index").checked,
    pages: Math.max(1, Math.min(100, parseInt(v("pages").value) || 1)),
    startNum: Math.max(0, Math.min(9999, parseInt(v("startNum").value) || 0)),   // 0 = automático
    coverTitle: v("coverTitle").value.trim(),
    coverSub: v("coverSub").value.trim(),
    coverName: v("coverName").checked,
    coverYear: v("coverYear").checked,
    coverNameText: v("coverNameText").value.trim(),
    coverYearText: v("coverYearText").value.trim() || String(new Date().getFullYear()),
  };
}

    ctx.strokeStyle = A; ctx.lineWidth = 0.8 * PT;
    hline(ctx, W / 2 - 15, W / 2 + 15, after + 7);
    if (d === "minimal") hline(ctx, W / 2 - 15, W / 2 + 15, ty - fit.size * PT - 5);
    after += 7;
  }
  if (o.coverSub) {
    const sy = d === "block" ? H * 0.5 + 12 : after + 9;
    label(ctx, o.coverSub, d === "block" ? 12 : tx, sy, subColor, 10, false, align);
  }
  if (o.coverYear) label(ctx, o.coverYearText, W - (d === "frame" ? 22 : 12), d === "frame" ? 24 : 16, yearColor, 10, true, "right");
  if (o.coverName) {
    label(ctx, L().yourName, nameX0, nameY, T.text, 9, false);
    const lx = nameX0 + textWidth(L().yourName, 9, false) + 3;
    ctx.strokeStyle = T.line; ctx.lineWidth = 0.6 * PT; hline(ctx, lx, nameX1, nameY + 0.5);
    if (o.coverNameText) label(ctx, o.coverNameText, lx + 2, nameY - 0.6, T.ink, 12, false);
  }
}

function drawContents(ctx, W, H, o) {
  const T = THEMES[state.theme], A = state.accent;
  ctx.fillStyle = T.paper; ctx.fillRect(0, 0, W, H);
  label(ctx, L().contents, 10, 16, T.ink, 13);
  const top = 22;
  ctx.strokeStyle = A; ctx.lineWidth = 0.8 * PT; hline(ctx, 6, W - 6, top);
  label(ctx, L().date, 8, top + 5, T.text); label(ctx, L().topic, 30, top + 5, T.text); label(ctx, L().page, W - 18, top + 5, T.text);
  ruled(ctx, T, 6, W - 6, top, H - 9, o.spacing, HEAD);
  ctx.strokeStyle = T.line; vline(ctx, 27, top, H - 11); vline(ctx, W - 21, top, H - 11);
}

// Dibuja algo en un canvas. widthPx: solo para la vista previa (más pequeña)
function render(drawFn, o, widthPx) {
  const P = pageSize();
  const w = widthPx || P.wPx, scale = w / P.wMm;
  const c = document.createElement("canvas");
  c.width = Math.round(w); c.height = Math.round(P.hMm * scale);
  const ctx = c.getContext("2d");
  ctx.scale(scale, scale);
  drawFn(ctx, P.wMm, P.hMm, o);
  return c;
}

const fill = (s, vars) => s.replace(/\{(\w+)\}/g, (_, k) => vars[k]);

function updatePreview() {
  const o = options(), P = pageSize(), t = T();

  // pestañas: portada e índice solo aparecen si están marcados
  const tabs = [];
  if (o.cover) tabs.push(["cover", t.tabCover]);
  if (o.index) tabs.push(["index", t.tabIndex]);
  tabs.push(["page", t.tabPage]);
  if (!tabs.some(x => x[0] === state.previewPage)) state.previewPage = "page";
  chips("pvTabs", tabs, "previewPage", true);

  // en la pestaña Portada, el panel muestra solo las opciones de portada
  const onCover = state.previewPage === "cover";
  document.querySelectorAll(".step.pg").forEach(el => { el.hidden = onCover; });
  document.getElementById("coverControls").hidden = !onCover;
  document.getElementById("coverBar").hidden = !onCover;
  document.getElementById("fnameNum").textContent = onCover ? 6 : 10;
  chips("coverDesigns", ["band", "frame", "block", "minimal"].map(k => [k, t.cd[k]]), "coverDesign");
  document.getElementById("coverInfo").textContent = t.ci[state.coverDesign];
  chips("coverWhere", [["separate", t.cw_sep], ["inside", t.cw_in]], "coverMode");
  document.getElementById("coverWhereInfo").textContent = state.coverMode === "separate" ? t.cwi_sep : t.cwi_in;
  document.getElementById("coverTitle").placeholder = o.subject || L().notebook;
  document.getElementById("coverNameText").style.display = o.coverName ? "" : "none";
  document.getElementById("coverYearText").style.display = o.coverYear ? "" : "none";
  document.getElementById("coverYearText").nextElementSibling.style.display = o.coverYear ? "" : "none";
  document.getElementById("coverNameText").nextElementSibling.style.display = o.coverName ? "" : "none";
  document.getElementById("coverYearText").placeholder = String(new Date().getFullYear());

  const fn = { cover: drawCover, index: drawContents, page: drawPage }[state.previewPage];
  const pv = document.getElementById("preview");
  const maxW = Math.min(pv.parentElement.clientWidth || 600, window.innerHeight * 0.74 * P.wMm / P.hMm);
  const dpr = window.devicePixelRatio || 1;
  const small = render(fn, o, maxW * dpr);
  pv.width = small.width; pv.height = small.height; pv.style.width = maxW + "px";
  pv.getContext("2d").drawImage(small, 0, 0);

  const fixed = ["grid", "dotted", "blank"].includes(state.style);
  document.getElementById("spacingVal").textContent = o.spacing;
  document.getElementById("spacingStep").style.opacity = fixed ? 0.45 : 1;
  document.getElementById("spacingHint").textContent = fixed ? t.h_spacing_fixed : t.h_spacing;
  document.getElementById("styleInfo").textContent = t.si[state.style];
  // Cornell ya trae su propia línea roja; la hoja en blanco no lleva margen
  document.getElementById("marginRow").style.display = state.style === "blank" ? "none" : "flex";
  document.getElementById("deviceInfo").textContent = fill(t.dev,
    { w: (P.wMm / 10).toFixed(1), h: (P.hMm / 10).toFixed(1), pw: P.wPx, ph: P.hPx });
  document.getElementById("cap").textContent =
    fill(t.cap, { n: o.pages }) + (o.cover ? (state.coverMode === "separate" ? t.capCoverSep : t.capCover) : "") + (o.index ? t.capIndex : "");

  document.getElementById("startNum").placeholder = String((o.cover && state.coverMode === "inside" ? 1 : 0) + (o.index ? 1 : 0) + 1);
  if (!state.fileEdited) document.getElementById("fname").value = autoName();
}

// 5. DESCARGAS
// ---------------------------------------------------------------
let downloads = null;
function msg(s) { document.getElementById("msg").textContent = s; }

// Nombre automático, corto y en inglés: Materia_Tipo_Color  (ej. Notebook_Lined, Lithuanian_Cornell_Dark)
function clean(s) { return s.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9]+/g, "-").replace(/^-+|-+$/g, ""); }
function autoName() {
  const o = options();
  const subj = clean(o.subject) || (o.cover ? clean(o.coverTitle) : "") || "Notebook";
  return [subj, STYLE_FILE[state.style], THEME_FILE[state.theme]].filter(Boolean).join("_");
}
function fileName(ext) {
  const typed = document.getElementById("fname").value.trim().replace(/\.(pdf|png)$/i, "");
  return (typed.replace(/[\\/:*?"<>|]+/g, "-") || autoName()) + "." + ext;
}

async function save(filename, blob) {
  const t = T();
  if (downloads) {
    try { await downloads.save({ filename, data: blob }); msg(t.done + filename); }
    catch (e) { msg(e && e.code === "declined" ? t.declined : t.fail); }
  } else {                       // fuera de Claude: descarga normal del navegador
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = filename; a.click();
    msg(t.done + filename);
  }
}

// ===============================================================
// PDF VECTORIAL
// Las mismas funciones de dibujo (drawPage, drawCover, drawContents)
// dibujan sobre un "lienzo PDF" en vez de un canvas: cada línea se
// guarda como instrucción vectorial, así se ve nítida a cualquier zoom.
// Los textos se guardan como imágenes muy finas (600 ppp) con fondo
// transparente, para que las letras lituanas (ą, ė, ų…) salgan bien.
// ===============================================================
const MM = 72 / 25.4;                       // milímetros → puntos PDF
const TEXT_RES = 24;                        // píxeles por mm para los textos (~610 ppp)
const measureCtx = document.createElement("canvas").getContext("2d");

function pdfColor(hex) { return [1, 3, 5].map(i => (parseInt(hex.slice(i, i + 2), 16) / 255).toFixed(3)).join(" "); }
const n2 = v => (+v).toFixed(2);

class PdfCanvas {
  constructor(wMm, hMm) {
    this.w = wMm; this.h = hMm; this.ops = []; this.texts = []; this.path = [];
    this.fillStyle = "#000000"; this.strokeStyle = "#000000"; this.lineWidth = 0.1;
    this.textAlign = "left"; this.textBaseline = "alphabetic"; this._font = "10px sans-serif"; this.dash = [];
  }
  X(x) { return n2(x * MM); }
  Y(y) { return n2((this.h - y) * MM); }
  scale() {}                                         // ya trabajamos en mm
  set font(f) { this._font = f; measureCtx.font = f; }
  get font() { return this._font; }
  measureText(t) { measureCtx.font = this._font; return measureCtx.measureText(t); }
  setLineDash(a) { this.dash = a; }
  fillRect(x, y, w, h) {
    this.ops.push(`${pdfColor(this.fillStyle)} rg ${this.X(x)} ${this.Y(y + h)} ${n2(w * MM)} ${n2(h * MM)} re f`);
  }
  beginPath() { this.path = []; }
  moveTo(x, y) { this.path.push(`${this.X(x)} ${this.Y(y)} m`); this.cur = [x, y]; }
  lineTo(x, y) { this.path.push(`${this.X(x)} ${this.Y(y)} l`); this.cur = [x, y]; }
  // esquina redondeada (como canvas.arcTo) con una curva Bézier
  arcTo(x1, y1, x2, y2, r) {
    const [x0, y0] = this.cur;
    const u = (ax, ay, bx, by) => { const d = Math.hypot(bx - ax, by - ay) || 1; return [(bx - ax) / d, (by - ay) / d]; };
    const [ux0, uy0] = u(x1, y1, x0, y0), [ux2, uy2] = u(x1, y1, x2, y2);
    const t1 = [x1 + ux0 * r, y1 + uy0 * r], t2 = [x1 + ux2 * r, y1 + uy2 * r], K = 0.5523;
    this.lineTo(t1[0], t1[1]);
    const c1 = [t1[0] + (x1 - t1[0]) * K, t1[1] + (y1 - t1[1]) * K], c2 = [t2[0] + (x1 - t2[0]) * K, t2[1] + (y1 - t2[1]) * K];
    this.path.push(`${this.X(c1[0])} ${this.Y(c1[1])} ${this.X(c2[0])} ${this.Y(c2[1])} ${this.X(t2[0])} ${this.Y(t2[1])} c`);
    this.cur = t2;
  }
  closePath() { this.path.push("h"); }
  stroke() {
    const d = this.dash.length ? `[${this.dash.map(v => n2(v * MM)).join(" ")}] 0 d` : "[] 0 d";
    this.ops.push(`${pdfColor(this.strokeStyle)} RG ${n2(this.lineWidth * MM)} w ${d}\n${this.path.join("\n")}\nS`);
  }
  fillText(txt, x, y) {
    // se guarda y luego se convierte en imagen nítida
    const m = this.measureText(txt), size = parseFloat(this._font.match(/([\d.]+)px/)[1]);
    const w = m.width, x0 = this.textAlign === "center" ? x - w / 2 : this.textAlign === "right" ? x - w : x;
    const top = y - size * 0.95, h = size * 1.25, pad = 0.3;
    const id = "T" + this.texts.length;
    this.texts.push({ id, txt, font: this._font, color: this.fillStyle, x0: x0 - pad, top: top - pad, w: w + 2 * pad, h: h + 2 * pad, baseY: y - top + pad, left: pad });
    this.ops.push(`q ${n2((w + 2 * pad) * MM)} 0 0 ${n2((h + 2 * pad) * MM)} ${this.X(x0 - pad)} ${this.Y(top - pad + h + 2 * pad)} cm /${id} Do Q`);
  }
}

async function deflate(bytes) {
  const s = new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate"));
  return new Uint8Array(await new Response(s).arrayBuffer());
}

// Convierte un texto en imagen RGB + máscara de transparencia
async function textImage(t) {
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.ceil(t.w * TEXT_RES)); c.height = Math.max(1, Math.ceil(t.h * TEXT_RES));
  const g = c.getContext("2d");
  g.scale(TEXT_RES, TEXT_RES);
  g.font = t.font; g.fillStyle = t.color; g.textBaseline = "alphabetic"; g.textAlign = "left";
  g.fillText(t.txt, t.left, t.baseY);
  const d = g.getImageData(0, 0, c.width, c.height).data;
  const rgb = new Uint8Array(c.width * c.height * 3), a = new Uint8Array(c.width * c.height);
  const [r, gg, b] = [1, 3, 5].map(i => parseInt(t.color.slice(i, i + 2), 16));
  for (let i = 0, j = 0, k = 0; i < d.length; i += 4) { rgb[j++] = r; rgb[j++] = gg; rgb[j++] = b; a[k++] = d[i + 3]; }
  return { w: c.width, h: c.height, rgb: await deflate(rgb), alpha: await deflate(a) };
}

// Dibuja una hoja en el lienzo PDF y devuelve sus instrucciones + textos
function vectorPage(drawFn, o) {
  const P = pageSize();
  const pc = new PdfCanvas(P.wMm, P.hMm);
  drawFn(pc, P.wMm, P.hMm, o);
  return pc;
}

// Arma el archivo PDF completo
async function buildVectorPdf(wMm, hMm, templates, pages) {
  // templates: { nombre: PdfCanvas } · pages: [{ tpl: nombre, number: texto o null }]
  const enc = new TextEncoder(), parts = [], offsets = [];
  let length = 0;
  const push = x => { const b = typeof x === "string" ? enc.encode(x) : x; parts.push(b); length += b.length; };
  const objs = [];
  const add = chunks => { objs.push(chunks); return objs.length; };
  const stream = async (str, extra = "") => {
    const z = await deflate(enc.encode(str));
    return add([`<< /Length ${z.length} /Filter /FlateDecode ${extra}>>\nstream\n`, z, "\nendstream"]);
  };

  const catalog = add(null), pagesObj = add(null);
  const font = add(["<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>"]);
  const W = n2(wMm * MM), H = n2(hMm * MM);

  // cada plantilla: su contenido vectorial (una sola vez) + sus textos como imágenes
  const tplInfo = {};
  for (const [name, pc] of Object.entries(templates)) {
    const xobj = [];
    for (const t of pc.texts) {
      const im = await textImage(t);
      const mask = add([`<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceGray /BitsPerComponent 8 /Filter /FlateDecode /Length ${im.alpha.length} >>\nstream\n`, im.alpha, "\nendstream"]);
      const img = add([`<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /FlateDecode /SMask ${mask} 0 R /Length ${im.rgb.length} >>\nstream\n`, im.rgb, "\nendstream"]);
      xobj.push(`/${t.id} ${img} 0 R`);
    }
    const content = await stream("1 J 1 j\n" + pc.ops.join("\n") + "\n");
    tplInfo[name] = { content, res: `<< /XObject << ${xobj.join(" ")} >> /Font << /F1 ${font} 0 R >> >>` };
  }

  const textCol = pdfColor(THEMES[state.theme].text);
  const kids = [];
  for (const pg of pages) {
    const info = tplInfo[pg.tpl];
    let contents = `${info.content} 0 R`;
    if (pg.number) {
      const np = new PdfCanvas(wMm, hMm);
      drawText(np, pg.number, wMm - 7, hMm - 3.5, THEMES[state.theme].text, 7, false, "right");
      // número dibujado como vector + el mismo número como texto invisible (para buscar y copiar)
      const tw = pg.number.length * 0.556 * 7;
      const c = np.ops.join("\n") + `\nBT /F1 7 Tf 3 Tr ${n2(wMm * MM - 7 * MM - tw)} ${n2(3.5 * MM)} Td (${pg.number}) Tj ET\n`;
      const num = await stream(c);
      contents = `[${info.content} 0 R ${num} 0 R]`;
    }
    kids.push(add([`<< /Type /Page /Parent ${pagesObj} 0 R /MediaBox [0 0 ${W} ${H}] /Resources ${info.res} /Contents ${contents} >>`]));
  }
  objs[catalog - 1] = [`<< /Type /Catalog /Pages ${pagesObj} 0 R >>`];
  objs[pagesObj - 1] = [`<< /Type /Pages /Kids [${kids.map(i => i + " 0 R").join(" ")}] /Count ${kids.length} >>`];

  push("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n");
  objs.forEach((chunks, i) => { offsets.push(length); push(`${i + 1} 0 obj\n`); chunks.forEach(push); push("\nendobj\n"); });
  const xref = length;
  push(`xref\n0 ${objs.length + 1}\n0000000000 65535 f \n`);
  offsets.forEach(o => push(String(o).padStart(10, "0") + " 00000 n \n"));
  push(`trailer\n<< /Size ${objs.length + 1} /Root ${catalog} 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(parts, { type: "application/pdf" });
}

async function makePdf() {
  msg(T().making);
  const o = options(), P = pageSize();
  const templates = {}, pages = [];
  let n = 0;
  if (o.cover && state.coverMode === "inside") { templates.cover = vectorPage(drawCover, o); pages.push({ tpl: "cover", number: null }); n++; }
  if (o.index) { templates.index = vectorPage(drawContents, o); pages.push({ tpl: "index", number: null }); n++; }
  templates.page = vectorPage(drawPage, o);              // una sola hoja que se repite
  // primer número: el que escribió la persona (para continuar un cuaderno) o, si está vacío, el que sigue a portada/índice
  const first = o.startNum || n + 1;
  for (let i = 0; i < o.pages; i++) pages.push({ tpl: "page", number: String(first + i) });
  await save(fileName("pdf"), await buildVectorPdf(P.wMm, P.hMm, templates, pages));
}

// Portada como imagen aparte, a la resolución exacta de la tablet
function coverName() { return fileName("png").replace(/\.png$/, "") + "_Cover.png"; }
async function makeCoverPng() {
  const c = render(drawCover, options());
  c.toBlob(b => save(coverName(), b), "image/png");
}

async function makePng() {
  const c = render(drawPage, options());
  c.toBlob(b => save(fileName("png"), b), "image/png");
}

// ---------------------------------------------------------------
// 6. ARRANQUE: botones, idioma de la app y cambios
// ---------------------------------------------------------------
function chips(id, items, key, small) {
  const box = document.getElementById(id);
  box.innerHTML = "";
  items.forEach(([value, text, dot]) => {
    const b = document.createElement("button");
    b.className = "chip" + (small ? " small" : "") + (state[key] === value ? " on" : "");
    if (dot) { const s = document.createElement("span"); s.className = "themeSw"; s.style.background = dot; b.appendChild(s); }
    b.appendChild(document.createTextNode(text));
    b.onclick = () => { state[key] = value; if (key === "ui") applyUI(); else { buildChips(); updatePreview(); } };
    box.appendChild(b);
  });
}

function accents() {
  const box = document.getElementById("accents"); box.innerHTML = "";
  ACCENTS.forEach(col => {
    const s = document.createElement("button");
    s.className = "sw" + (state.accent === col ? " on" : ""); s.style.background = col; s.title = col;
    s.onclick = () => { state.accent = col; accents(); updatePreview(); };
    box.appendChild(s);
  });
  // círculo de colores: cualquier color que quieras
  const custom = !ACCENTS.includes(state.accent);
  const p = document.createElement("label");
  p.className = "picker" + (custom ? " on" : "");
  if (custom) p.style.background = state.accent;
  const inp = document.createElement("input"); inp.type = "color"; inp.value = state.accent;
  inp.oninput = () => { state.accent = inp.value; p.style.background = inp.value; p.classList.add("on");
                        box.querySelectorAll(".sw").forEach(x => x.classList.remove("on")); updatePreview(); };
  p.appendChild(inp); box.appendChild(p);
}

function buildChips() {
  const t = T();
  chips("orient", [["portrait", t.portrait], ["landscape", t.landscape]], "orient");
  chips("styles", STYLES.map(s => [s, t.st[s]]), "style");
  chips("langs", Object.entries(LANGS).map(([k, v]) => [k, v.name]), "lang");
  chips("themes", Object.keys(THEMES).map(k => [k, t.th[k], THEMES[k].paper]), "theme");
}

function applyUI() {
  const t = T();
  document.documentElement.lang = state.ui;
  document.title = t.title;
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t[el.dataset.t]; });
  document.getElementById("subject").placeholder = t.ph_subject;
  document.getElementById("coverSub").placeholder = t.ph_csub;
  document.getElementById("coverNameText").placeholder = t.ph_cname;
  chips("appLang", [["es", "ES"], ["en", "EN"], ["lt", "LT"]], "ui", true);
  buildChips();
  updatePreview();
}

const sel = document.getElementById("device");
const groups = {};
DEVICES.forEach(d => {
  if (!groups[d.group]) { groups[d.group] = document.createElement("optgroup"); groups[d.group].label = d.group; sel.appendChild(groups[d.group]); }
  const op = document.createElement("option"); op.value = d.id; op.textContent = d.name; groups[d.group].appendChild(op);
});
sel.value = state.device;
sel.onchange = () => { state.device = sel.value; updatePreview(); };

accents();
document.getElementById("backToPage").onclick = () => { state.previewPage = "page"; updatePreview(); window.scrollTo({ top: 0, behavior: "smooth" }); };
// al marcar "Portada", la mostramos de una vez para que se vean sus opciones
document.getElementById("cover").addEventListener("change", e => { if (e.target.checked) { state.previewPage = "cover"; updatePreview(); } });
["spacing", "header", "subject", "margin", "cover", "index", "pages", "startNum", "coverTitle", "coverSub", "coverName", "coverYear", "coverNameText", "coverYearText"].forEach(id =>
  document.getElementById(id).addEventListener("input", updatePreview));
// si la persona escribe su propio nombre de archivo, lo respetamos; si lo borra, vuelve el automático
document.getElementById("fname").addEventListener("input", e => { state.fileEdited = e.target.value.trim() !== ""; });
document.getElementById("fname").addEventListener("blur", () => { if (!state.fileEdited) updatePreview(); });
document.getElementById("dlPdf").onclick = makePdf;
document.getElementById("dlPng").onclick = makePng;
document.getElementById("dlCover").onclick = makeCoverPng;
window.addEventListener("resize", updatePreview);
applyUI();

// Permiso de descargas dentro de Claude (si no existe, usamos la descarga normal)
if (window.claude && window.claude.use) {
  window.claude.use("downloads").then(d => { downloads = d; }).catch(() => {});
}

// App instalable: registra el service worker (solo funciona en la versión de GitHub, no dentro de Claude)
if ("serviceWorker" in navigator && location.protocol === "https:" && window.top === window) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
